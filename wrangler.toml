name = "store-resolve"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/diagnostics/pilot-mail"]

[vars]
NOTIFICATION_MODE = "FAMILY_PILOT"
EXTERNAL_NOTIFICATIONS_ENABLED = "false"
VAPID_PUBLIC_KEY = "BEaf_RWjGAb19TP5EoFUiEU5Sautp58BH5RLzMSbZwApds4Ob9sudVD4WkOUhQD6pMugRNms93Sm9Zknt2cjCAk"

# The operations tick is intentionally NOT scheduled. The legacy tick loads unbounded
# application state per run.
#
# The Dad-only pilot tick (worker/dad-pilot-tick.ts).
# Enabled 2026-10-19 with owner approval. Requires email_ingestion_enabled='true'.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "store-resolve"
database_id = "4f8132e3-3a81-4d66-9986-4656095e7779"
migrations_dir = "drizzle"
